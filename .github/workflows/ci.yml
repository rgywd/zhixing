name: PR policy

on:
  pull_request:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test repository policy
        run: >-
          node --test
          .github/scripts/check-skill-parity.test.mjs
          .github/scripts/ci-plan.test.mjs
          .github/scripts/check-release-metadata.test.mjs
          .github/scripts/local-verify.test.mjs

      - name: Validate agent skill mirrors
        run: node .github/scripts/check-skill-parity.mjs

      - name: Validate source branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/check-branch-name.sh "${HEAD_REF}"

      - name: Plan local verification
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-plan.mjs

      - name: Validate release metadata
        if: steps.plan.outputs.metadata_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node .github/scripts/check-release-metadata.mjs
          "${BASE_SHA}"
          "${HEAD_SHA}"

      - name: Summarize policy
        env:
          REASON: ${{ steps.plan.outputs.reason }}
          RUN_WORK: ${{ steps.plan.outputs.run_work }}
          RUN_ANDROID: ${{ steps.plan.outputs.run_android }}
          METADATA_ONLY: ${{ steps.plan.outputs.metadata_only }}
        run: |
          {
            echo "### PR policy"
            echo
            echo "- change class: \`${REASON}\`"
            echo "- local Work verification required: \`${RUN_WORK}\`"
            echo "- local Android verification required: \`${RUN_ANDROID}\`"
            echo "- release metadata validated here: \`${METADATA_ONLY}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
