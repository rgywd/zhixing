name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "需要重试发布的既有 vX.Y.Z 标签"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASES_REPOSITORY: rgywd/zhixing-releases

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${REQUESTED_TAG}"
          version="${tag#v}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use strict vX.Y.Z format." >&2
            exit 1
          fi
          git fetch origin main --tags
          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "Release tag ${tag} does not exist." >&2
            exit 1
          fi
          tagged_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tagged_sha}" ]]; then
            echo "Workflow checkout does not match release tag ${tag}." >&2
            exit 1
          fi
          gradle_version="$(perl -ne 'print "$1\n" if /versionName\s*=\s*"([^"]+)"/' app/build.gradle.kts | head -n 1)"
          if [[ "${version}" != "${gradle_version}" ]]; then
            echo "Tag version ${version} does not match app version ${gradle_version}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tagged_sha}" origin/main; then
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${tagged_sha}" >> "$GITHUB_OUTPUT"

  release-tests:
    name: Release tests
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Test release-critical paths
        run: |
          ./gradlew :ai:testDebugUnitTest :speech:testDebugUnitTest :workspace:testDebugUnitTest
          ./gradlew :app:testStagingUnitTest \
            --tests me.rerere.rikkahub.AppIdentityTest \
            --tests me.rerere.rikkahub.DistributionIdentityTest \
            --tests me.rerere.rikkahub.utils.UpdateCheckerTest \
            --tests me.rerere.rikkahub.data.datastore.DefaultProvidersTest \
            --tests me.rerere.rikkahub.data.ai.tools.GitHubCliToolTest \
            --tests me.rerere.rikkahub.data.ai.GenerationHandlerSecurityTest \
            --tests me.rerere.rikkahub.data.ai.GenerationPromptsTest \
            --tests me.rerere.rikkahub.data.ai.tools.MemoryToolsTest \
            --tests me.rerere.rikkahub.data.profile.ProfileMaintenanceServiceTest \
            --tests me.rerere.rikkahub.data.profile.ProfileMemoryPolicyTest \
            --tests me.rerere.rikkahub.data.repository.MemoryForgetPolicyTest \
            --tests me.rerere.rikkahub.data.repository.MemoryRepositoryTest \
            --tests me.rerere.rikkahub.data.sync.DatabaseBackupContractTest \
            --tests me.rerere.rikkahub.ui.pages.assistant.detail.AssistantMemoryCreationTest \
            --tests me.rerere.rikkahub.data.agenda.AgendaTaskPolicyTest \
            --tests me.rerere.rikkahub.data.agenda.AgendaTimeParserTest \
            --tests me.rerere.rikkahub.ui.pages.setting.components.ProviderConfigureConvertToTest

  release-apk:
    name: Signed release APK
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare signing configuration
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          test -n "${KEY_BASE64}" || { echo "Missing KEY_BASE64 secret" >&2; exit 1; }
          test -n "${SIGNING_CONFIG}" || { echo "Missing SIGNING_CONFIG secret" >&2; exit 1; }
          printf '%s' "${KEY_BASE64}" | base64 --decode > app/app.key
          printf '%s\n' "${SIGNING_CONFIG}" > local.properties

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ needs.resolve.outputs.tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish public release
    needs:
      - resolve
      - release-tests
      - release-apk
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: signed-release-${{ needs.resolve.outputs.tag }}
          path: app/build/outputs/apk/release

      - name: Load release asset tooling
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.resolve.outputs.tag }}
        run: |
          tooling_path="${RUNNER_TEMP}/prepare-release-assets.sh"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/prepare-release-assets.sh?ref=${TOOLING_REF}" \
            > "${tooling_path}"
          test -s "${tooling_path}" || { echo "Release asset tooling is empty." >&2; exit 1; }
          chmod +x "${tooling_path}"
          echo "RELEASE_ASSET_SCRIPT=${tooling_path}" >> "${GITHUB_ENV}"

      - name: Prepare release assets and update manifest
        id: assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          RELEASES_REPOSITORY: ${{ env.RELEASES_REPOSITORY }}
        run: bash "${RELEASE_ASSET_SCRIPT}"

      - name: Publish public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          RELEASES_REPOSITORY: ${{ env.RELEASES_REPOSITORY }}
        run: |
          test -n "${GH_TOKEN}" || { echo "Missing RELEASES_REPO_TOKEN secret" >&2; exit 1; }
          if [[ "${RELEASES_REPOSITORY}" != "rgywd/zhixing-releases" ]] || \
             [[ "${RELEASES_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "Official releases must target only rgywd/zhixing-releases, never ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

          assets=(
            "release/zhixing-${VERSION}-universal.apk"
            "release/zhixing-${VERSION}-source.tar.gz"
            "release/latest.json"
            "release/SHA256SUMS.txt"
            "release/LICENSE"
            "release/THIRD_PARTY_NOTICES.md"
          )

          if [[ -f "release-notes/${VERSION}.md" ]]; then
            notes_file="release-notes/${VERSION}.md"
          else
            notes_file="${RUNNER_TEMP}/release-notes.md"
            git log -1 --pretty=%B > "${notes_file}"
          fi

          if gh release view "${TAG_NAME}" --repo "${RELEASES_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" \
              --repo "${RELEASES_REPOSITORY}" \
              --clobber
            gh release edit "${TAG_NAME}" \
              --repo "${RELEASES_REPOSITORY}" \
              --title "Zhixing v${VERSION}" \
              --notes-file "${notes_file}" \
              --latest
          else
            gh release create "${TAG_NAME}" "${assets[@]}" \
              --repo "${RELEASES_REPOSITORY}" \
              --target main \
              --title "Zhixing v${VERSION}" \
              --notes-file "${notes_file}" \
              --latest
          fi
