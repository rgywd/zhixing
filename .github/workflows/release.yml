name: Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Run this workflow from a v* tag so the update URL remains immutable." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use strict vX.Y.Z format." >&2
            exit 1
          fi
          gradle_version="$(perl -ne 'print "$1\n" if /versionName\s*=\s*"([^"]+)"/' app/build.gradle.kts | head -n 1)"
          if [[ "${version}" != "${gradle_version}" ]]; then
            echo "Tag version ${version} does not match app version ${gradle_version}." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing configuration
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          test -n "${KEY_BASE64}" || { echo "Missing KEY_BASE64 secret" >&2; exit 1; }
          test -n "${SIGNING_CONFIG}" || { echo "Missing SIGNING_CONFIG secret" >&2; exit 1; }
          printf '%s' "${KEY_BASE64}" | base64 --decode > app/app.key
          printf '%s\n' "${SIGNING_CONFIG}" > local.properties

      - name: Test release-critical paths
        run: |
          ./gradlew :ai:testDebugUnitTest :speech:testDebugUnitTest
          ./gradlew :app:testDebugUnitTest \
            --tests me.rerere.rikkahub.AppIdentityTest \
            --tests me.rerere.rikkahub.utils.UpdateCheckerTest \
            --tests me.rerere.rikkahub.data.datastore.DefaultProvidersTest \
            --tests me.rerere.rikkahub.data.ai.tools.local.GitHubIssueToolTest \
            --tests me.rerere.rikkahub.data.github.GitHubIssueClientTest \
            --tests me.rerere.rikkahub.ui.pages.setting.components.ProviderConfigureConvertToTest

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease

      - name: Prepare release assets and update manifest
        id: assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          universal_source="$(find app/build/outputs/apk/release -type f -name '*universal*release*.apk' -print -quit)"
          test -n "${universal_source}" || { echo "Universal release APK was not produced" >&2; exit 1; }

          universal_name="zhixing-${VERSION}-universal.apk"
          cp "${universal_source}" "release/${universal_name}"

          sha256="$(sha256sum "release/${universal_name}" | cut -d ' ' -f 1)"
          size_bytes="$(stat -c '%s' "release/${universal_name}")"
          size="$(numfmt --to=iec-i --suffix=B "${size_bytes}")"
          if [[ -f "release-notes/${VERSION}.md" ]]; then
            changelog="$(cat "release-notes/${VERSION}.md")"
          else
            changelog="$(git log -1 --pretty=%B)"
          fi
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${universal_name}"

          jq -n \
            --arg version "${VERSION}" \
            --arg publishedAt "${published_at}" \
            --arg changelog "${changelog}" \
            --arg name "${universal_name}" \
            --arg url "${download_url}" \
            --arg size "${size}" \
            --arg sha256 "${sha256}" \
            '{version: $version, publishedAt: $publishedAt, changelog: $changelog, downloads: [{name: $name, url: $url, size: $size, sha256: $sha256}]}' \
            > release/latest.json

          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zhixing v${{ steps.version.outputs.version }}
          body_path: release-notes/${{ steps.version.outputs.version }}.md
          generate_release_notes: true
          files: release/*
