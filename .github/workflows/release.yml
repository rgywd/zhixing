name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "需要重试发布的既有 vX.Y.Z 标签"
        required: true
        type: string
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${REQUESTED_TAG}"
          version="${tag#v}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use strict vX.Y.Z format." >&2
            exit 1
          fi
          git fetch origin main --tags
          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "Release tag ${tag} does not exist." >&2
            exit 1
          fi
          tagged_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tagged_sha}" ]]; then
            echo "Workflow checkout does not match release tag ${tag}." >&2
            exit 1
          fi
          gradle_version="$(perl -ne 'print "$1\n" if /versionName\s*=\s*"([^"]+)"/' app/build.gradle.kts | head -n 1)"
          if [[ "${version}" != "${gradle_version}" ]]; then
            echo "Tag version ${version} does not match app version ${gradle_version}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tagged_sha}" origin/main; then
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing configuration
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          test -n "${KEY_BASE64}" || { echo "Missing KEY_BASE64 secret" >&2; exit 1; }
          test -n "${SIGNING_CONFIG}" || { echo "Missing SIGNING_CONFIG secret" >&2; exit 1; }
          printf '%s' "${KEY_BASE64}" | base64 --decode > app/app.key
          printf '%s\n' "${SIGNING_CONFIG}" > local.properties

      - name: Test release-critical paths
        run: |
          ./gradlew :ai:testDebugUnitTest :speech:testDebugUnitTest
          ./gradlew :app:testStagingUnitTest \
            --tests me.rerere.rikkahub.AppIdentityTest \
            --tests me.rerere.rikkahub.utils.UpdateCheckerTest \
            --tests me.rerere.rikkahub.data.datastore.DefaultProvidersTest \
            --tests me.rerere.rikkahub.data.ai.tools.local.GitHubIssueToolTest \
            --tests me.rerere.rikkahub.data.github.GitHubIssueClientTest \
            --tests me.rerere.rikkahub.ui.pages.setting.components.ProviderConfigureConvertToTest

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease

      - name: Prepare release assets and update manifest
        id: assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release
          mapfile -t release_apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one universal release APK, found ${#release_apks[@]}" >&2
            printf '%s\n' "${release_apks[@]}" >&2
            exit 1
          fi
          universal_source="${release_apks[0]}"

          universal_name="zhixing-${VERSION}-universal.apk"
          cp "${universal_source}" "release/${universal_name}"

          sha256="$(sha256sum "release/${universal_name}" | cut -d ' ' -f 1)"
          size_bytes="$(stat -c '%s' "release/${universal_name}")"
          size="$(numfmt --to=iec-i --suffix=B "${size_bytes}")"
          if [[ -f "release-notes/${VERSION}.md" ]]; then
            changelog="$(cat "release-notes/${VERSION}.md")"
          else
            changelog="$(git log -1 --pretty=%B)"
          fi
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${universal_name}"

          jq -n \
            --arg version "${VERSION}" \
            --arg publishedAt "${published_at}" \
            --arg changelog "${changelog}" \
            --arg name "${universal_name}" \
            --arg url "${download_url}" \
            --arg size "${size}" \
            --arg sha256 "${sha256}" \
            '{version: $version, publishedAt: $publishedAt, changelog: $changelog, downloads: [{name: $name, url: $url, size: $size, sha256: $sha256}]}' \
            > release/latest.json

          sha256sum "release/${universal_name}" > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Zhixing v${{ steps.version.outputs.version }}
          body_path: release-notes/${{ steps.version.outputs.version }}.md
          generate_release_notes: true
          files: release/*
