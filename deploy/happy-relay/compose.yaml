name: zhixing-happy

services:
  happy-relay:
    build:
      context: ${HAPPY_BUILD_CONTEXT:-https://github.com/slopus/happy.git#3f161de70541b1cedaf0b7547ed70889d8dae22d}
      dockerfile: Dockerfile
    environment:
      HANDY_MASTER_SECRET: ${HANDY_MASTER_SECRET:?HANDY_MASTER_SECRET is required}
      PUBLIC_URL: ${HAPPY_PUBLIC_URL:?HAPPY_PUBLIC_URL is required}
      PORT: "3005"
      DATA_DIR: /data
      PGLITE_DIR: /data/pglite
      METRICS_ENABLED: "false"
    ports:
      - "${HAPPY_BIND_ADDRESS:-127.0.0.1}:${HAPPY_BIND_PORT:-3005}:3005"
    volumes:
      - happy-data:/data
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    profiles:
      - bundled-proxy
    environment:
      HAPPY_DOMAIN: ${HAPPY_DOMAIN:?HAPPY_DOMAIN is required for bundled-proxy}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      happy-relay:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  happy-data:
    name: zhixing-happy-data
  caddy-data:
    name: zhixing-happy-caddy-data
  caddy-config:
    name: zhixing-happy-caddy-config
