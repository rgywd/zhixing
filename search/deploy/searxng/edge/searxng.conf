server {
    listen 443 ssl;
    server_name searxng.47.85.179.5.sslip.io;
    server_tokens off;

    ssl_certificate /etc/nginx/searxng/letsencrypt/live/searxng.47.85.179.5.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/searxng/letsencrypt/live/searxng.47.85.179.5.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZhixingSearXNGTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 1k;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        proxy_pass https://zhixing-searxng-gateway:8443/healthz;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name searxng.47.85.179.5.sslip.io;
        proxy_ssl_verify off;
        proxy_set_header Connection "";
        proxy_set_header Host searxng.47.85.179.5.sslip.io;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /search {
        limit_except GET {
            deny all;
        }

        proxy_pass https://zhixing-searxng-gateway:8443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name searxng.47.85.179.5.sslip.io;
        proxy_ssl_verify off;
        proxy_set_header Connection "";
        proxy_set_header Host searxng.47.85.179.5.sslip.io;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
