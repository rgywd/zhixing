use_default_settings: true

general:
  debug: false
  instance_name: Zhixing SearXNG

search:
  safe_search: 1
  autocomplete: ""
  favicon_resolver: ""
  default_lang: ""
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 40
  pool_maxsize: 10
  enable_http2: true
